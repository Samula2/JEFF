<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ln4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121706" />
      <stop offset="100%" stop-color="#060802" />
    </linearGradient>
    <filter id="voltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#d2ff00" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Carbon Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="url(#ln4Bg)" stroke="#d2ff00" stroke-width="2" />

  <!-- Speed Chamfer Line -->
  <path d="M 44,4 L 60,20 L 60,4 Z" fill="#d2ff00" opacity="0.9" />

  <!-- Racing Monogram: 04 -->
  <text x="31" y="42" font-family="'JetBrains Mono', Consolas, monospace, sans-serif" font-size="28" font-weight="900" fill="#d2ff00" text-anchor="middle" letter-spacing="-1" filter="url(#voltGlow)">04</text>

  <!-- Papaya Racing Stripe Accent -->
  <rect x="12" y="49" width="40" height="3" rx="1.5" fill="#ff8000" />
</svg>
