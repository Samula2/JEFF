<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Base Orb Gradient -->
    <radialGradient id="aeroOrb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034078" />
    </radialGradient>

    <!-- Top Specular Glare -->
    <linearGradient id="topGlare" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Water Reflection -->
    <radialGradient id="bottomRim" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#034078" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Orb Body with Shadow -->
  <circle cx="32" cy="32" r="28" fill="url(#aeroOrb)" filter="url(#orbShadow)" stroke="#bae6fd" stroke-width="1" />

  <!-- Bottom Rim Light -->
  <ellipse cx="32" cy="52" rx="16" ry="6" fill="url(#bottomRim)" />

  <!-- Top Specular Glare (Classic Frutiger Aero Jelly / Glass Bubble) -->
  <path d="M 12,25 C 13,13 22,8 32,8 C 42,8 51,13 52,25 C 45,21 39,19 32,19 C 25,19 19,21 12,25 Z" fill="url(#topGlare)" />

  <!-- Inner Letter J -->
  <text x="32" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" style="filter: drop-shadow(0 2px 4px rgba(3, 64, 120, 0.6));">J</text>

  <!-- Sparkle Accent -->
  <circle cx="48" cy="18" r="2" fill="#ffffff" opacity="0.9" />
  <path d="M 48,13 L 48,23 M 43,18 L 53,18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
</svg>
